name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fast:
    name: Fast tier (CPU)
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4

      # mujoco loads EGL at import time (MUJOCO_GL=egl) and opencv needs libGL;
      # the hosted runners ship neither.
      - name: Install system GL libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Core numeric stack pinned to environment.yml, CPU-only jax.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            jax==0.9.0 jaxlib==0.9.0 brax==0.14.0 flax==0.12.3 optax==0.2.6 \
            mujoco==3.4.0 mujoco-mjx==3.4.0 playground==0.0.5 minimal-mjx==0.1.19 \
            ml-collections==1.1.0 numpy==2.3.5 scipy==1.17.0
          python -m pip install -e ".[dev]"

      - name: Run fast tests
        run: python -m pytest

  # The GPU tier (`pytest -m gpu`) needs a CUDA runner; run it locally or on a
  # self-hosted GPU runner.
