name: mog1
save_dir: /storage/scratch1/1/mfangajei3/moplayground/mog1
description: "?"
algorithm: morlax
env: "MOG1"
backend: np # jnp or np. Always uses jnp for training
env_config:
  ctrl_dt: 0.02
  sim_dt: 0.004
  action_scale: 0.5
  history_length: 5
  ideal_base_height: 0.28
  ideal_base_vel: 0.5
  add_random_joint_state: False
  add_random_pitch: False
  noise_scale: 1.0
  reward:
    weights: 
      # TODO: increase alive and decrease done  
      vel_rate:   -1.0
      accel_rate: -1.0
      speed:      1.0
      run:        1.0
      alive:      1.0
      done:       0
      perp_vel:   -1.0
      heading_dev: -1.0
    optimization:
      objectives:        [['vel_rate', 'accel_rate'], ["speed"]]
      shared_objectives: ['alive', 'run', 'perp_vel', 'heading_dev']
      labels:            ['Smoothness', 'Forward Velocity']
      default_scalarization: [1, 1]
  termination:
    enabled: true        # Enable or disable early termination
    base_height: 0.6
learning_params:
  ppo_params:
    action_repeat: 1
    batch_size: 64
    clipping_epsilon: 0.2
    deterministic_eval: true
    discounting: 0.99
    entropy_cost: 0.01
    episode_length: 500
    learning_rate: 2.0e-05
    max_grad_norm: 1.0
    normalize_observations: true
    num_envs: 2048
    num_evals: 25
    num_minibatches: 16
    num_timesteps: 500000000
    num_updates_per_batch: 4
    reward_scaling: 1.0
    unroll_length: 20
  sampling_params:
    alpha: 1.0
    k: 8
    sampling: sparse-heavytail
    warmup_frac: 0.0
  morlax_network_params:
    hypertype: dual
    hypersize: [512, 512]
    num_features: 16
    policy_hidden_layer_sizes: [256, 256] #TODO: increase sizes to 128x128
    value_hidden_layer_sizes: [256, 256]
  amor_network_params:
    policy_hidden_layer_sizes: [256, 256, 256]
    value_hidden_layer_sizes: [256, 256, 256]
  ppo_network_params:
    policy_hidden_layer_sizes: [64, 64]
    value_hidden_layer_sizes: [64, 64]
  morlax_warmup_params:
    enabled: false
    policy: playground-results/SO-MOCheetah/a-good-policy/config.yaml
