[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moplayground"
version = "0.1.6"
description = "GPU-Accelerable Multi-Objective RL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  { name = "Neil Janwani", email = "njanwani@gatech.edu" },
  { name = "Maako Fangajei", email = "mfangajei3@gatech.edu" },
  { name = "Varun Madabushi", email = "vmadabushi@gatech.edu" }
]
dependencies = [
  "numpy",
  "jax",
  "playground",
  "pymoo",
  "matplotlib",
  "opencv-python",
  "pandas",
  "tqdm",
  "mediapy",
  "minimal-mjx",
]

[project.optional-dependencies]
dev = ["pytest", "black"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import scripts.*
addopts = "-m 'not gpu' -ra"
markers = [
  "gpu: end-to-end tests that train/evaluate on a CUDA device (run with `pytest -m gpu`)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
